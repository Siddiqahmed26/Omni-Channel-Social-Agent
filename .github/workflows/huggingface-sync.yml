name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME || 'siddiq262001' }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME || 'my-social-agent' }}
        run: |
          echo "Syncing to Hugging Face Space: $HF_USERNAME/$HF_SPACE_NAME"
          # Ensure we are in a clean state
          rm -rf .git
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "deploy: clean mirror from github"
          git checkout -b main
          # Push to HF hub - hide token in logs
          git push -f https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main

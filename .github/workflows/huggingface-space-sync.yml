name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: huggingface-space-sync-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to Hugging Face Space (triggers rebuild)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set. Add it in GitHub repo settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ -z "$HF_USERNAME" ]; then
            echo "HF_USERNAME repo variable is not set. Add it in GitHub repo settings -> Variables -> Actions."
            exit 1
          fi

          # Ensure the hf remote can be added even if it already exists
          git remote remove hf 2>/dev/null || true
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/my-social-agent"
          git push hf HEAD:main
